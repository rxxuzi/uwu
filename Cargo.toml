[package]
name = "uwu"
version = "0.6.1"
edition = "2021"
authors = ["rxxuzi"]
description = "UWU - Windows Utilities"
license = "MIT"
repository = "https://github.com/rxxuzi/uwu"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Terminal colors
colored = "2.1"

once_cell = "1.19"  # For lazy static colors
# URL encoding for web command
urlencoding = "2.1"

crossterm = "0.27"

# JSON serialization for alias storage
serde_json = "1.0"

# PNG encoding for screenshots (lightweight, pure Rust)
png = "0.17"

# .gitignore-aware directory walking for `tree` (ripgrep/fd's engine)
ignore = "0.4"


# Windows specific
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "implement",
] }
libloading = "0.8"
[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Optional: Faster builds for development
[profile.dev]
opt-level = 0

# Optional: Optimized build with debug info
[profile.release-with-debug]
inherits = "release"
strip = false
debug = true