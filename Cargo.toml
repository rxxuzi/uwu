[package]
name = "uwu"
version = "0.1.0"
edition = "2021"
authors = ["rxxuzi"]
description = "UWU - Windows Utilities"
license = "MIT"
repository = "https://github.com/rxxuzi/uwu"


[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Terminal colors
colored = "2.1"

# File system
walkdir = "2.4"
glob = "0.3"

# URL encoding for web command
urlencoding = "2.1"

# Windows specific
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true